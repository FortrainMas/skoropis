[project]
name = "diploma"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ivan Shebanov", email = "vanamokanov8@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
  "pillow>=13.0.0",
  "torch>=2.11.0",
  "torchvision>=0.26.0",
  "transformers>=5.1",
]

[project.scripts]
diploma = "diploma.cli:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
